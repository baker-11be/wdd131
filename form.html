<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product review form designed by Mfitundinda Baker for WDD 131 assignment.">
  <meta name="author" content="Baker Mfitundinda">
  <title>Product Review Form | WDD 131</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form-review.css">
  <script src="scripts/form.js" defer></script>
  <script src="scripts/getdates.js" defer></script>
</head>
<body>
  <header class="page-header">
    <h1>Product Review Form</h1>
    <p>Share your experience with a product.</p>
  </header>

  <main>
    <form method="get" action="review.html" class="review-form">
      <fieldset>
        <legend>Review Details</legend>

        <div class="field-group">
          <label for="productName">Product Name <span aria-hidden="true">*</span></label>
          <select id="productName" name="productName" required>
            <option value="" disabled selected>Select a Product ...</option>
          </select>
        </div>

        <div class="field-group">
          <p class="rating-label">Overall Rating <span aria-hidden="true">*</span></p>
          <div class="rating-group" role="radiogroup" aria-labelledby="ratingPrompt">
            <span id="ratingPrompt" class="sr-only">Select a rating from one to five stars</span>

            <input type="radio" id="rating1" name="overallRating" value="1" required>
            <label for="rating1" title="1 star">☆</label>

            <input type="radio" id="rating2" name="overallRating" value="2" required>
            <label for="rating2" title="2 stars">☆☆</label>

            <input type="radio" id="rating3" name="overallRating" value="3" required>
            <label for="rating3" title="3 stars">☆☆☆</label>

            <input type="radio" id="rating4" name="overallRating" value="4" required>
            <label for="rating4" title="4 stars">☆☆☆☆</label>

            <input type="radio" id="rating5" name="overallRating" value="5" required>
            <label for="rating5" title="5 stars">☆☆☆☆☆</label>
          </div>
        </div>

        <div class="field-group">
          <label for="installDate">Date of Installation <span aria-hidden="true">*</span></label>
          <input type="date" id="installDate" name="installDate" required>
        </div>

        <fieldset class="sub-fieldset">
          <legend>Useful Features (Check all that apply)</legend>
          <div class="checkbox-group">
            <input type="checkbox" id="durability" name="usefulFeatures" value="durability">
            <label for="durability">Durability</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="easeOfUse" name="usefulFeatures" value="ease-of-use">
            <label for="easeOfUse">Ease of Use</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="performance" name="usefulFeatures" value="performance">
            <label for="performance">Performance</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="design" name="usefulFeatures" value="design">
            <label for="design">Design</label>
          </div>
        </fieldset>

        <div class="field-group">
          <label for="writtenReview">Written Review (Optional)</label>
          <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Tell us what worked well for you."></textarea>
        </div>

        <div class="field-group">
          <label for="userName">Your Name (Optional)</label>
          <input type="text" id="userName" name="userName" autocomplete="name">
        </div>

        <div class="actions">
          <input type="submit" value="Submit Review">
        </div>
      </fieldset>
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> | Baker Mfitundinda | Uganda</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
