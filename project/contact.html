<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Send Trail Compass your hiking question or suggest a trail to add.">
  <meta name="author" content="Baker Mfitundinda">
  <title>Trail Compass | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="scripts/contact.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="index.html" aria-label="Trail Compass home">
        <span class="brand-mark" aria-hidden="true">TC</span>
        <span>Trail Compass</span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="trails.html">Trails</a>
        <a class="active" href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container page-main">
    <section class="page-intro">
      <p class="eyebrow">Plan Better Hikes</p>
      <h1>Contact Trail Compass</h1>
      <p>Share your question or suggest a trail. Your most recent submissions are saved in your browser.</p>
    </section>

    <section class="panel" aria-labelledby="contact-heading">
      <h2 id="contact-heading">Hiker Request Form</h2>
      <form id="contact-form" class="trail-form" novalidate>
        <label for="full-name">Full name</label>
        <input id="full-name" name="full-name" type="text" required minlength="2" maxlength="50" autocomplete="name">

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required autocomplete="email">

        <label for="hike-date">Planned hike date</label>
        <input id="hike-date" name="hike-date" type="date" required>

        <label for="experience">Hiking experience</label>
        <select id="experience" name="experience" required>
          <option value="">Select one</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>

        <fieldset>
          <legend>Preferred season</legend>
          <label><input type="radio" name="season" value="dry" required> Dry season</label>
          <label><input type="radio" name="season" value="rainy"> Rainy season</label>
        </fieldset>

        <label for="target-trail">Trail of interest</label>
        <select id="target-trail" name="target-trail" required>
          <option value="">Select one</option>
          <option value="Sunridge Loop">Sunridge Loop</option>
          <option value="Kagera Bluff Path">Kagera Bluff Path</option>
          <option value="Mwamba Ridge Climb">Mwamba Ridge Climb</option>
        </select>

        <label for="message">Your question or request</label>
        <textarea id="message" name="message" rows="5" minlength="15" maxlength="500" required></textarea>

        <button class="btn" type="submit">Send Request</button>
      </form>
      <p id="form-feedback" class="feedback" aria-live="polite"></p>
      <div id="saved-submissions" class="saved-submissions"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p>&copy; <span id="year"></span> Trail Compass | Baker Mfitundinda</p>
      <a href="references.html">References</a>
    </div>
  </footer>
</body>
</html>
