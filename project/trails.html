<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore Trail Compass routes by region, distance, and difficulty.">
  <meta name="author" content="Baker Mfitundinda">
  <title>Trail Compass | Trails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="scripts/trails.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="index.html" aria-label="Trail Compass home">
        <span class="brand-mark" aria-hidden="true">TC</span>
        <span>Trail Compass</span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a class="active" href="trails.html">Trails</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container page-main">
    <section class="page-intro">
      <p class="eyebrow">Find Your Route</p>
      <h1>Trail Library</h1>
      <p>Filter by region and difficulty to narrow down trails that fit your time and energy level.</p>
    </section>

    <section class="panel" aria-labelledby="filter-heading">
      <h2 id="filter-heading">Filter Trails</h2>
      <form id="trail-filter-form" class="trail-form" novalidate>
        <label for="search">Search by trail name</label>
        <input id="search" name="search" type="text" placeholder="Example: Ridge" maxlength="40">

        <label for="region">Region</label>
        <select id="region" name="region">
          <option value="all">All regions</option>
        </select>

        <label for="difficulty">Difficulty</label>
        <select id="difficulty" name="difficulty">
          <option value="all">All levels</option>
          <option value="easy">Easy</option>
          <option value="moderate">Moderate</option>
          <option value="hard">Hard</option>
        </select>

        <label for="max-distance">Max distance (km)</label>
        <input id="max-distance" name="max-distance" type="range" min="4" max="22" step="1" value="22">
        <p id="distance-output" class="distance-output">Up to 22 km</p>
      </form>
    </section>

    <section class="panel" aria-labelledby="results-heading">
      <div class="section-head">
        <h2 id="results-heading">Matching Trails</h2>
        <p id="results-status" aria-live="polite"></p>
      </div>
      <div id="trails-grid" class="trail-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p>&copy; <span id="year"></span> Trail Compass | Baker Mfitundinda</p>
      <a href="references.html">References</a>
    </div>
  </footer>
</body>
</html>
